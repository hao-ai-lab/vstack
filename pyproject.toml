[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vstack"
version = "0.1.0"
description = "Formal verification workflow and mechanical anti-reward-hacking toolkit for coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hao AI Lab" }]
keywords = ["formal-verification", "tla-plus", "z3", "tlaps", "coding-agents"]

[project.scripts]
vstack = "vstack_cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "vstack_cli.py",
  "skills",
  "agents",
  "scripts",
  "templates",
  "docs",
]
